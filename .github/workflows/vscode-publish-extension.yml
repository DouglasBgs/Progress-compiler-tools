name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish Extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter / Type-Check
        run: npm run lint

      - name: Publish to VS Code Marketplace (retry)
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          if [[ -z "$VS_MARKETPLACE_TOKEN" ]]; then
            echo "Secret VS_MARKETPLACE_TOKEN não configurado." >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Tentativa de publicação ${attempt}/3..."

            if npx @vscode/vsce@latest publish --pat "$VS_MARKETPLACE_TOKEN"; then
              echo "Publicação concluída com sucesso."
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              wait_seconds=$((attempt * 45))
              echo "Falha transitória ao publicar. Nova tentativa em ${wait_seconds}s..."
              sleep "$wait_seconds"
            fi
          done

          echo "Falha ao publicar após 3 tentativas." >&2
          exit 1

